---
name: CI Build in GraalVM native-image with tests

on:
  push:
    branches:
      - master
      - jdbi4-dev
  pull_request:
    branches:
      - master
      - jdbi4-dev

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The test reporter publishes a check run. A pull_request build from a fork gets a
# read-only token regardless, and falls back to annotations there.
permissions:
  contents: read
  checks: write

jobs:
  native-build:
    runs-on: ubuntu-latest
    name: GraalVM ${{ matrix.graalvm-version }} ${{ matrix.distribution }} native build
    strategy:
      fail-fast: false
      # Spelled out rather than a cross product, because the cells are not
      # interchangeable: only the interim releases can run exact reachability
      # metadata, so that will be enabled per cell rather than globally.
      matrix:
        include:
          - graalvm-version: '25.0'
            distribution: 'graalvm'
          - graalvm-version: '25.0'
            distribution: 'graalvm-community'
          - graalvm-version: '25.2'
            distribution: 'graalvm'
          - graalvm-version: '25.2'
            distribution: 'graalvm-community'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        name: setup build jdk
        id: build_jdk
        with:
          version: ${{ matrix.graalvm-version }}
          distribution: ${{ matrix.distribution }}
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build code
        id: install
        env:
          MAVEN_ARGS: "-B -ff -Djdbi.native=true"
        run: |
          ./mvnw --version
          make install

      - uses: ./.github/actions/test-report
        name: report native test failures
        with:
          name: 'native test report'

      - uses: actions/upload-artifact@v7
        name: upload build logs
        id: upload_build_logs
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: build logs (${{ github.job }}, ${{ matrix.graalvm-version }}, ${{ matrix.distribution }})
          retention-days: 90
          path: |
            **/target
            !**/target/**/*.jar
            !**/target/**/*.class

      - uses: actions/upload-artifact@v7
        name: upload build artifacts
        id: upload_build_artifacts
        continue-on-error: true
        with:
          name: build artifacts (${{ github.job }}, ${{ matrix.graalvm-version }}, ${{ matrix.distribution }})
          retention-days: 1
          path: |
            **/target/native-tests
            **/target/native-test-reports/*

  native-demo:
    runs-on: ubuntu-latest
    name: GraalVM ${{ matrix.graalvm-version }} ${{ matrix.distribution }} native demo
    strategy:
      fail-fast: false
      matrix:
        include:
          - graalvm-version: '25.0'
            distribution: 'graalvm'
          - graalvm-version: '25.0'
            distribution: 'graalvm-community'
          - graalvm-version: '25.2'
            distribution: 'graalvm'
          - graalvm-version: '25.2'
            distribution: 'graalvm-community'

    # examples/native-demo is deliberately not a reactor module: it builds standalone
    # against released Jdbi artifacts, the way a user's own project does. Nothing in the
    # main build therefore compiles it, so give it its own job.
    steps:
      - uses: actions/checkout@v6

      - uses: graalvm/setup-graalvm@v1
        name: setup build jdk
        id: build_jdk
        with:
          version: ${{ matrix.graalvm-version }}
          distribution: ${{ matrix.distribution }}
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build native demo
        id: demo
        env:
          MAVEN_ARGS: "-B -ff"
        run: ./mvnw -f examples/native-demo/pom.xml clean verify

      - name: run native demo
        id: demo_run
        # Building the image proves less than it looks: a missing reflection registration
        # or a mapper that cannot construct a record fails while the image runs, not while
        # it is built. So run the binary and check what it produced. A Demo[...] line means
        # ConstructorMapper built a record from a result set through reflection metadata,
        # and a Sum line means an aggregate mapped to a primitive. The demo pauses between
        # queries, so ask for a short run rather than the default 1000.
        run: |
          set -euo pipefail
          queries=20
          if ! ./examples/native-demo/target/jdbi3-graalvm-aot-executable "$queries" > demo.log 2>&1; then
            echo "::error::native demo exited non-zero"
            tail -50 demo.log
            exit 1
          fi

          mapped=$(grep -cE 'Demo\[id=[0-9]+, name=User Name[0-9a-f-]+, count=[0-9]+\]' demo.log || true)
          sums=$(grep -cE 'Sum of [0-9]+ to [0-9]+: [0-9]+' demo.log || true)
          echo "mapped records: $mapped/$queries, aggregate results: $sums/$queries"

          if [ "$mapped" -ne "$queries" ] || [ "$sums" -ne "$queries" ]; then
            echo "::error::expected $queries mapped records and $queries aggregates, got $mapped and $sums"
            tail -50 demo.log
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        name: upload build logs
        continue-on-error: true
        if: ${{ failure() && (steps.demo.conclusion == 'failure' || steps.demo_run.conclusion == 'failure') }}
        with:
          name: build logs (${{ github.job }}, ${{ matrix.graalvm-version }}, ${{ matrix.distribution }})
          retention-days: 90
          path: |
            demo.log
            examples/native-demo/target
            !examples/native-demo/target/**/*.jar
            !examples/native-demo/target/**/*.class
