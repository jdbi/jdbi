---
# Reusable body for the dependency-version matrix jobs. Each caller in
# versions-check.yml supplies the modules to build and the property that pins the
# version under test; everything else about the run is the same for all of them.
name: dependency version tests

on:
  workflow_call:
    inputs:
      name:
        description: What is being varied, lowercase, for the check run name (e.g. "guava").
        required: true
        type: string
      versions:
        description: JSON array of versions to test, e.g. '["1.0", "2.0"]'.
        required: true
        type: string
      property:
        description: >
          Maven property that pins the version under test, e.g. "dep.guava.version".
          The version is appended here rather than passed in already substituted,
          because the matrix only exists inside this workflow.
        required: true
        type: string
      projects:
        description: >
          Optional -pl module list, e.g. ":jdbi3-guava,:jdbi3-guice". Omit to build
          the whole reactor.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-version: ${{ fromJSON(inputs.versions) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-java@v5
        name: setup build jdk
        id: build_jdk
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: build code
        id: install_fast
        env:
          MAVEN_ARGS: "-B -ff"
        run: |
          ./mvnw --version
          make install-fast

      - name: run tests
        id: run_tests
        env:
          MAVEN_ARGS: >-
            -B -ff
            ${{ inputs.projects && format('-pl {0}', inputs.projects) || '' }}
            -D${{ inputs.property }}=${{ matrix.test-version }}
        run: |
          ./mvnw --version
          make run-tests

      - uses: ./.github/actions/test-report
        name: report test failures
        if: ${{ !cancelled() }}
        with:
          name: 'test report (${{ inputs.name }} ${{ matrix.test-version }})'

      - uses: actions/upload-artifact@v7
        name: upload build logs
        id: upload_build_logs
        continue-on-error: true
        if: ${{ always() }}
        with:
          name: build logs (${{ inputs.name }}, ${{ matrix.test-version }})
          retention-days: 90
          path: |
            **/target
            !**/target/**/*.jar
            !**/target/**/*.class

      - uses: actions/upload-artifact@v7
        name: upload build artifacts
        id: upload_build_artifacts
        continue-on-error: true
        with:
          name: build artifacts (${{ inputs.name }}, ${{ matrix.test-version }})
          retention-days: 1
          path: |
            **/target/**/*.jar
