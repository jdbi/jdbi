---
name: Test dependency versions

on:
  push:
    branches:
      - master
      - jdbi4-dev
  pull_request:
    branches:
      - master
      - jdbi4-dev

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Inherited by the called workflow, which publishes a check run.
permissions:
  contents: read
  checks: write

# Every job here is the same build run against a different version of one dependency,
# so the run itself lives in dependency-version-tests.yml.
jobs:
  guava:
    name: Test Guava versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: guava
      versions: '["33.4.8-jre", "33.3.1-jre", "33.2.1-jre"]'
      property: dep.guava.version
      projects: ':jdbi3-guava,:jdbi3-guice'

  immutables:
    name: Test Immutables versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: immutables
      versions: '["2.11.6", "2.10.1", "2.9.3"]'
      property: dep.immutables.version
      projects: ':jdbi3-core'

  jackson2:
    name: Test Jackson Versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: jackson2
      versions: '["2.20.2", "2.19.4", "2.18.5", "2.17.3"]'
      property: dep.jackson2.version
      projects: ':jdbi3-jackson2'

  jodatime2:
    name: Test joda-time versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: jodatime2
      versions: '["2.13.1", "2.12.7"]'
      property: dep.joda-time.version
      projects: ':jdbi3-jodatime2'

  vavr:
    name: Test vavr versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: vavr
      versions: '["0.10.6", "0.9.3"]'
      property: dep.vavr.version
      projects: ':jdbi3-vavr'

  guice:
    name: Test guice versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: guice
      versions: '["6.0.0", "7.0.0"]'
      property: dep.guice.version
      projects: ':jdbi3-guice'

  kotlin:
    name: Test kotlin runtime versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: kotlin
      versions: '["2.2.21", "2.1.21", "2.0.21"]'
      property: dep.kotlin.version
      projects: ':jdbi3-kotlin,:jdbi3-kotlin-sqlobject'

  spring:
    name: Test spring framework versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: spring
      versions: '["6.1.21", "7.0.6"]'
      property: dep.spring.version
      projects: ':jdbi3-spring'

  slf4j:
    name: Test slf4j versions
    uses: ./.github/workflows/dependency-version-tests.yml
    with:
      name: slf4j
      versions: '["2.1.0-alpha1"]'
      property: dep.slf4j.version
