---
name: test report
description: Publish JUnit reports from a test run as a check run on the pull request.

inputs:
  name:
    description: >
      Check run name. Must be unique within a workflow run, so a job with a matrix has
      to include the matrix values.
    required: true

runs:
  using: composite
  steps:
    - uses: mikepenz/action-junit-report@v6
      # Reporting a failure must not be able to cause or mask one.
      continue-on-error: true
      if: ${{ always() }}
      with:
        # Covers both surefire and the native-image runs, which write
        # target/native-test-reports. A job produces one or the other, never both: the
        # native profile sets basepom.test.skip. Invoker writes BUILD-*.xml, so the
        # TEST- prefix leaves it out.
        report_paths: '**/target/*-reports/TEST-*.xml'
        check_name: ${{ inputs.name }}
        # The default truncates to two lines, which cuts the Caused by: chain where the
        # actual cause usually is.
        truncate_stack_traces: false
